version: '3.8'

services:
  business-central:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - SERVER_SERVLET_CONTEXT_PATH=/business-central
    volumes:
      - tomcat_logs:/usr/local/tomcat/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/business-central/api/assets"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  tomcat_logs:
