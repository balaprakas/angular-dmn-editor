# Server Configuration
server.port=8080
server.servlet.context-path=/business-central

# Spring Boot Configuration
spring.application.name=business-central-alternative

# Logging Configuration
logging.level.com.businesscentral=INFO
logging.level.org.kie=WARN
logging.level.org.drools=WARN

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=false

# Kogito Configuration
kogito.service.url=http://localhost:8080
